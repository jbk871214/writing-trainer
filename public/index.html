<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每日写作训练</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fafafa">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #333; }
    .app { max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .page { flex: 1; padding: 16px; display: none; }
    .page.active { display: block; }
    .tab-bar { display: flex; border-top: 1px solid #eee; background: #fff; }
    .tab { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; font-size: 14px; color: #999; }
    .tab.active { color: #333; font-weight: bold; }
    button { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:active { opacity: 0.8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .topic-card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .topic-card .title { font-size: 16px; margin-bottom: 8px; white-space: pre-wrap; }
    .topic-card button { margin-top: 8px; width: 100%; }
    textarea { width: 100%; height: 55vh; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 16px; line-height: 1.6; resize: none; }
    .word-count { text-align: right; color: #999; font-size: 12px; margin-top: 4px; }
    .article-list-item, .draft-item { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .article-list-item .date, .draft-item .date { font-size: 12px; color: #999; }
    .review-box { background: #f0f8ff; border-radius: 8px; padding: 12px; margin: 16px 0; }
    .sub-tabs { display: flex; margin: 12px 0; }
    .sub-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; background: #eee; }
    .sub-tab.active { background: #333; color: #fff; }
    .back-btn { background: #999; margin-bottom: 8px; }
    .error-msg { color: #e00; font-size: 14px; margin: 8px 0; }
    .regen-hint { font-size: 12px; color: #666; margin-left: 8px; }
    .regen-container { display: flex; align-items: center; margin-top: 8px; }
    .regen-container button { flex: 1; }
    .regen-container .regen-hint { flex: 1; text-align: right; }
  </style>
</head>
<body>
  <div class="app">
    <div id="page-daily" class="page active">
      <h2 style="margin-bottom:12px">今日写作</h2>
      <div id="daily-date"></div>
      <div id="daily-topics-area"></div>
      <div id="daily-editor" style="display:none">
        <button class="back-btn" id="daily-back-btn">← 返回题目</button>
        <div id="selected-topic" style="font-weight:bold;margin-bottom:8px"></div>
        <textarea id="writing-area" placeholder="开始写..."></textarea>
        <div class="word-count" id="word-count">共 0 字</div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="save-draft-btn" style="flex:1;background:#666">保存草稿</button>
          <button id="submit-btn" style="flex:1">完成并提交</button>
        </div>
      </div>
      <div id="review-area" style="display:none">
        <div class="review-box" id="review-text"></div>
        <button id="copy-review-article">复制全文</button>
        <button id="back-from-review" style="background:#999;margin-left:8px">返回</button>
      </div>
    </div>

    <div id="page-small" class="page">
      <h2 style="margin-bottom:12px">试试这些小事</h2>
      <div id="small-topic-card" class="topic-card">
        <div class="title" id="small-topic-text"></div>
        <button id="small-start-btn">开始写</button>
        <button id="small-refresh-btn" style="background:#999;margin-top:8px">换一个</button>
      </div>
      <div id="small-editor" style="display:none">
        <button class="back-btn" id="small-back-btn">← 返回</button>
        <div id="small-selected-topic" style="font-weight:bold;margin-bottom:8px"></div>
        <textarea id="small-writing-area" placeholder="开始写..."></textarea>
        <div class="word-count" id="small-word-count">共 0 字</div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="small-save-draft-btn" style="flex:1;background:#666">保存草稿</button>
          <button id="small-submit-btn" style="flex:1">完成并提交</button>
        </div>
      </div>
      <div id="small-review-area" style="display:none">
        <div class="review-box" id="small-review-text"></div>
        <button id="small-copy-review">复制全文</button>
        <button id="small-back-review" style="background:#999;margin-left:8px">返回</button>
      </div>
    </div>

    <div id="page-articles" class="page">
      <h2 style="margin-bottom:12px">我的文章</h2>
      <div class="sub-tabs">
        <div class="sub-tab active" data-subtab="published">文章</div>
        <div class="sub-tab" data-subtab="drafts">草稿箱</div>
      </div>
      <div id="published-list"></div>
      <div id="drafts-list" style="display:none"></div>
    </div>

    <div class="tab-bar">
      <div class="tab active" data-page="daily">今日写作</div>
      <div class="tab" data-page="small">随便写点</div>
      <div class="tab" data-page="articles">我的文章</div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const getDeviceId = () => {
      let id = localStorage.getItem('device_id');
      if (!id) { id = crypto.randomUUID(); localStorage.setItem('device_id', id); }
      return id;
    };
    const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const todayStr = formatDate(new Date());

    // IndexedDB
    const dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open('writing-trainer', 2);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('articles')) {
          db.createObjectStore('articles', { keyPath: 'id', autoIncrement: true });
        }
        if (!db.objectStoreNames.contains('drafts')) {
          db.createObjectStore('drafts', { keyPath: 'id', autoIncrement: true });
        }
      };
      request.onsuccess = (e) => resolve(e.target.result);
      request.onerror = (e) => reject(e.target.error);
    });

    const saveArticle = async (article) => {
      const db = await dbPromise;
      const tx = db.transaction('articles', 'readwrite');
      tx.objectStore('articles').add(article);
      return tx.complete;
    };
    const getAllArticles = async () => {
      const db = await dbPromise;
      const tx = db.transaction('articles', 'readonly');
      return new Promise(resolve => {
        const request = tx.objectStore('articles').getAll();
        request.onsuccess = () => resolve(request.result.reverse());
      });
    };

    const saveDraft = async (draft) => {
      const db = await dbPromise;
      const tx = db.transaction('drafts', 'readwrite');
      tx.objectStore('drafts').add(draft);
      return tx.complete;
    };
    const getAllDrafts = async () => {
      const db = await dbPromise;
      const tx = db.transaction('drafts', 'readonly');
      return new Promise(resolve => {
        const request = tx.objectStore('drafts').getAll();
        request.onsuccess = () => resolve(request.result.reverse());
      });
    };
    const deleteDraftById = async (id) => {
      const db = await dbPromise;
      const tx = db.transaction('drafts', 'readwrite');
      tx.objectStore('drafts').delete(id);
      return tx.complete;
    };

    // 页面切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        $(`#page-${tab.dataset.page}`).classList.add('active');
        if (tab.dataset.page === 'articles') loadArticlesAndDrafts();
      });
    });

    // 二级 Tab 切换
    document.querySelectorAll('.sub-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const subtab = tab.dataset.subtab;
        if (subtab === 'published') {
          $('#published-list').style.display = 'block';
          $('#drafts-list').style.display = 'none';
        } else {
          $('#published-list').style.display = 'none';
          $('#drafts-list').style.display = 'block';
        }
        loadArticlesAndDrafts();
      });
    });

    // 历史题目去重
    const getHistoryTopics = () => {
      try {
        return JSON.parse(localStorage.getItem('historyTopics') || '[]');
      } catch { return []; }
    };
    const addHistoryTopics = (newTopics) => {
      const history = getHistoryTopics();
      newTopics.forEach(t => {
        if (!history.includes(t)) history.push(t);
      });
      localStorage.setItem('historyTopics', JSON.stringify(history.slice(-50)));
    };

    // 重新生成次数控制
    const getRegenInfo = () => {
      const date = localStorage.getItem('regenDate');
      if (date !== todayStr) {
        return { remaining: 3, total: 3 };
      }
      const remaining = parseInt(localStorage.getItem('regenRemaining') || '3', 10);
      return { remaining, total: 3 };
    };
    const setRegenRemaining = (val) => {
      localStorage.setItem('regenDate', todayStr);
      localStorage.setItem('regenRemaining', val);
    };

    // 今日写作：生成话题
    async function genDailyTopics() {
      const regen = getRegenInfo();
      let isFirstGen = true;
      try {
        const cache = JSON.parse(localStorage.getItem('dailyTopicsCache') || 'null');
        isFirstGen = !(cache && cache.date === todayStr);
      } catch { isFirstGen = true; }

      if (!isFirstGen && regen.remaining <= 0) {
        alert('今日重新生成次数已用完');
        return;
      }

      const btn = document.getElementById('gen-daily-btn');
      if (btn) {
        btn.textContent = '生成中...';
        btn.disabled = true;
      }

      try {
        const rssRes = await fetch('/api/rss-news');
        const { rssContent } = await rssRes.json();
        const seed = parseInt(getDeviceId().replace(/-/g,'').slice(0,8), 16) + Date.now();
        const history = getHistoryTopics();
        const res = await fetch('/api/generate-topics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'daily', seed, rssContent, excludeTopics: history })
        });
        const data = await res.json();
        if (data.topics?.length) {
          while (data.topics.length < 3) data.topics.push('自由写作');
          const threeTopics = data.topics.slice(0, 3);
          addHistoryTopics(threeTopics);
          localStorage.setItem('dailyTopicsCache', JSON.stringify({ date: todayStr, topics: threeTopics }));
          if (isFirstGen) {
            setRegenRemaining(3);
          } else {
            setRegenRemaining(regen.remaining - 1);
          }
          renderTopics(threeTopics);
        } else {
          throw new Error(data.error || '未知错误');
        }
      } catch (e) {
        console.error(e);
        const area = $('#daily-topics-area');
        area.innerHTML = `<button id="gen-daily-btn" style="width:100%">生成今日话题</button><div class="error-msg">${e.message}</div>`;
        document.getElementById('gen-daily-btn').addEventListener('click', genDailyTopics);
      }
    }

    function renderTopics(topics) {
      const area = $('#daily-topics-area');
      area.innerHTML = '';
      const styleLabels = ['命题作文', '材料作文', '半命题作文'];
      topics.forEach((t, i) => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.innerHTML = `
          <div style="font-size:12px;color:#999;margin-bottom:4px">${styleLabels[i] || '题目'}</div>
          <div class="title">${t}</div>
          <button class="select-topic-btn">选这个写</button>
        `;
        card.querySelector('.select-topic-btn').addEventListener('click', () => startWriting(t));
        area.appendChild(card);
      });

      const regen = getRegenInfo();
      const container = document.createElement('div');
      container.className = 'regen-container';
      const btn = document.createElement('button');
      btn.textContent = '重新生成';
      btn.style.background = '#999';
      btn.disabled = regen.remaining <= 0;
      btn.addEventListener('click', genDailyTopics);
      const hint = document.createElement('span');
      hint.className = 'regen-hint';
      hint.textContent = `(${regen.remaining}/3) 重新生成后当前题目将被替换，旧题不会保留`;
      container.appendChild(btn);
      container.appendChild(hint);
      area.appendChild(container);
    }

    // 开始写作（今日写作）—— 异步函数，恢复草稿
    async function startWriting(topic) {
      $('#daily-topics-area').style.display = 'none';
      $('#daily-editor').style.display = 'block';
      $('#selected-topic').textContent = topic;
      $('#writing-area').value = '';
      updateWordCount();

      const textarea = $('#writing-area');
      if (!textarea.dataset.listenerAttached) {
        textarea.dataset.listenerAttached = '1';
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const val = textarea.value;
            textarea.value = val.substring(0, start) + '\n\u3000\u3000' + val.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + 3;
            updateWordCount();
          }
        });
        textarea.addEventListener('input', updateWordCount);
      }

      // 从 IndexedDB 查找草稿
      const drafts = await getAllDrafts();
      const matched = drafts.find(d => d.topic === topic && d.source === 'daily' && d.date === todayStr);
      if (matched) {
        textarea.value = matched.content;
        textarea.dataset.draftId = matched.id;
      } else {
        textarea.dataset.draftId = '';
      }
      updateWordCount();
    }

    function updateWordCount() {
      $('#word-count').textContent = `共 ${$('#writing-area').value.length} 字`;
    }

    // 返回按钮：回到题目列表
    $('#daily-back-btn').addEventListener('click', () => {
      $('#daily-editor').style.display = 'none';
      $('#daily-topics-area').style.display = 'block';
      const cache = localStorage.getItem('dailyTopicsCache');
      if (cache) {
        const parsed = JSON.parse(cache);
        if (parsed.date === todayStr && parsed.topics?.length) {
          renderTopics(parsed.topics);
        } else {
          $('#daily-topics-area').innerHTML = '<button id="gen-daily-btn" style="width:100%">生成今日话题</button>';
          document.getElementById('gen-daily-btn').addEventListener('click', genDailyTopics);
        }
      } else {
        $('#daily-topics-area').innerHTML = '<button id="gen-daily-btn" style="width:100%">生成今日话题</button>';
        document.getElementById('gen-daily-btn').addEventListener('click', genDailyTopics);
      }
    });

    // 保存草稿（今日写作）—— 自动覆盖同日同题旧草稿
    $('#save-draft-btn').addEventListener('click', async () => {
      const topic = $('#selected-topic').textContent;
      const content = $('#writing-area').value;
      if (!content.trim()) { alert('内容为空，无法保存草稿'); return; }
      // 删除同日同题同来源的旧草稿
      const drafts = await getAllDrafts();
      for (const d of drafts) {
        if (d.topic === topic && d.source === 'daily' && d.date === todayStr) {
          await deleteDraftById(d.id);
        }
      }
      await saveDraft({ date: todayStr, topic, content, source: 'daily', timestamp: Date.now() });
      alert('草稿已保存');
    });

    // 提交评分（今日写作）
    $('#submit-btn').addEventListener('click', async () => {
      const topic = $('#selected-topic').textContent;
      let content = $('#writing-area').value;
      if (!content.trim()) { alert('内容为空'); return; }
      content = content.split('\n').map(line => line.trim() ? '\u3000\u3000' + line : line).join('\n');
      $('#writing-area').value = content;
      try {
        const res = await fetch('/api/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article: content, topic })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '评分失败');
        await saveArticle({ date: todayStr, topic, content, review: data.review || '', timestamp: Date.now() });
        // 删除相关草稿
        const drafts = await getAllDrafts();
        for (const d of drafts) {
          if (d.topic === topic && d.source === 'daily' && d.date === todayStr) {
            await deleteDraftById(d.id);
          }
        }
        $('#daily-editor').style.display = 'none';
        $('#review-area').style.display = 'block';
        $('#review-text').textContent = data.review || '感谢你的分享，继续加油！';
      } catch (e) {
        alert(`提交失败：${e.message}`);
      }
    });

    $('#copy-review-article').addEventListener('click', () => {
      navigator.clipboard.writeText($('#writing-area').value);
      alert('已复制全文');
    });
    $('#back-from-review').addEventListener('click', () => {
      $('#review-area').style.display = 'none';
      $('#daily-topics-area').style.display = 'block';
      const cache = localStorage.getItem('dailyTopicsCache');
      if (cache) {
        const parsed = JSON.parse(cache);
        if (parsed.date === todayStr && parsed.topics?.length) {
          renderTopics(parsed.topics);
        }
      }
    });

    // ========== 随便写点 ==========
    let smallTopicCache = [];
    async function loadSmallTopic() {
      if (smallTopicCache.length === 0) {
        try {
          const history = getHistoryTopics();
          const res = await fetch('/api/generate-topics', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'small-things', seed: Math.floor(Math.random()*10000), excludeTopics: history })
          });
          const data = await res.json();
          if (data.topics?.length) smallTopicCache = data.topics;
        } catch (e) { console.error(e); }
      }
      if (smallTopicCache.length > 0) {
        $('#small-topic-text').textContent = smallTopicCache[0];
      } else {
        $('#small-topic-text').textContent = '写下今天最安静的时刻';
      }
    }

    $('#small-refresh-btn').addEventListener('click', async () => {
      smallTopicCache = [];
      await loadSmallTopic();
    });

    // 开始写（随便写点）—— 异步，恢复草稿
    $('#small-start-btn').addEventListener('click', async () => {
      const topic = $('#small-topic-text').textContent;
      $('#small-topic-card').style.display = 'none';
      $('#small-editor').style.display = 'block';
      $('#small-selected-topic').textContent = topic;
      $('#small-writing-area').value = '';
      updateSmallWordCount();

      const textarea = $('#small-writing-area');
      if (!textarea.dataset.listenerAttached) {
        textarea.dataset.listenerAttached = '1';
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const val = textarea.value;
            textarea.value = val.substring(0, start) + '\n\u3000\u3000' + val.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + 3;
            updateSmallWordCount();
          }
        });
        textarea.addEventListener('input', updateSmallWordCount);
      }

      // 从 IndexedDB 查找草稿
      const drafts = await getAllDrafts();
      const matched = drafts.find(d => d.topic === topic && d.source === 'small' && d.date === todayStr);
      if (matched) {
        textarea.value = matched.content;
        textarea.dataset.draftId = matched.id;
      } else {
        textarea.dataset.draftId = '';
      }
      updateSmallWordCount();
    });

    function updateSmallWordCount() {
      $('#small-word-count').textContent = `共 ${$('#small-writing-area').value.length} 字`;
    }

    $('#small-back-btn').addEventListener('click', () => {
      $('#small-editor').style.display = 'none';
      $('#small-topic-card').style.display = 'block';
    });

    // 保存草稿（随便写点）—— 自动覆盖
    $('#small-save-draft-btn').addEventListener('click', async () => {
      const topic = $('#small-selected-topic').textContent;
      const content = $('#small-writing-area').value;
      if (!content.trim()) { alert('内容为空，无法保存草稿'); return; }
      // 删除旧草稿
      const drafts = await getAllDrafts();
      for (const d of drafts) {
        if (d.topic === topic && d.source === 'small' && d.date === todayStr) {
          await deleteDraftById(d.id);
        }
      }
      await saveDraft({ date: todayStr, topic, content, source: 'small', timestamp: Date.now() });
      alert('草稿已保存');
    });

    // 提交评分（随便写点）
    $('#small-submit-btn').addEventListener('click', async () => {
      const topic = $('#small-selected-topic').textContent;
      let content = $('#small-writing-area').value;
      if (!content.trim()) { alert('内容为空'); return; }
      content = content.split('\n').map(line => line.trim() ? '\u3000\u3000' + line : line).join('\n');
      $('#small-writing-area').value = content;
      try {
        const res = await fetch('/api/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article: content, topic })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '评分失败');
        await saveArticle({ date: todayStr, topic, content, review: data.review || '', timestamp: Date.now() });
        // 删除相关草稿
        const drafts = await getAllDrafts();
        for (const d of drafts) {
          if (d.topic === topic && d.source === 'small' && d.date === todayStr) {
            await deleteDraftById(d.id);
          }
        }
        $('#small-editor').style.display = 'none';
        $('#small-review-area').style.display = 'block';
        $('#small-review-text').textContent = data.review || '感谢你的分享，继续加油！';
      } catch (e) {
        alert(`提交失败：${e.message}`);
      }
    });

    $('#small-copy-review').addEventListener('click', () => {
      navigator.clipboard.writeText($('#small-writing-area').value);
      alert('已复制全文');
    });
    $('#small-back-review').addEventListener('click', () => {
      $('#small-review-area').style.display = 'none';
      $('#small-topic-card').style.display = 'block';
    });

    // ========== 我的文章（文章+草稿箱） ==========
    async function loadArticlesAndDrafts() {
      // 已发布
      const articles = await getAllArticles();
      const publishedDiv = $('#published-list');
      publishedDiv.innerHTML = articles.length ? '' : '<p style="color:#999;text-align:center;margin-top:32px;">还没有发布文章</p>';
      articles.forEach(a => {
        const div = document.createElement('div');
        div.className = 'article-list-item';
        div.innerHTML = `<div class="date">${a.date}</div><div><b>${a.topic || '无题'}</b></div><div style="color:#666">${a.content.slice(0,50)}...</div>`;
        div.addEventListener('click', () => {
          if (confirm('查看全文并复制？')) {
            navigator.clipboard.writeText(a.content);
            alert(`题目：${a.topic}\n\n${a.content}\n\n${a.review ? '评语：'+a.review : ''}`);
          }
        });
        publishedDiv.appendChild(div);
      });

      // 草稿
      const drafts = await getAllDrafts();
      const draftsDiv = $('#drafts-list');
      draftsDiv.innerHTML = drafts.length ? '' : '<p style="color:#999;text-align:center;margin-top:32px;">草稿箱为空</p>';
      drafts.forEach(d => {
        const div = document.createElement('div');
        div.className = 'draft-item';
        div.innerHTML = `
          <div class="date">${d.date} · ${d.source === 'daily' ? '今日写作' : '随便写点'}</div>
          <div><b>${d.topic || '无题'}</b></div>
          <div style="color:#666">${d.content.slice(0,50)}...</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="edit-draft-btn" style="flex:1;background:#555">继续编辑</button>
            <button class="delete-draft-btn" style="flex:1;background:#a00">删除</button>
          </div>
        `;
        div.querySelector('.edit-draft-btn').addEventListener('click', () => {
          if (d.source === 'daily') {
            document.querySelector('.tab[data-page="daily"]').click();
            $('#daily-topics-area').style.display = 'none';
            $('#daily-editor').style.display = 'block';
            $('#selected-topic').textContent = d.topic;
            $('#writing-area').value = d.content;
            updateWordCount();
          } else {
            document.querySelector('.tab[data-page="small"]').click();
            $('#small-topic-card').style.display = 'none';
            $('#small-editor').style.display = 'block';
            $('#small-selected-topic').textContent = d.topic;
            $('#small-writing-area').value = d.content;
            updateSmallWordCount();
          }
        });
        div.querySelector('.delete-draft-btn').addEventListener('click', async () => {
          if (confirm('确定删除这篇草稿？')) {
            await deleteDraftById(d.id);
            loadArticlesAndDrafts();
          }
        });
        draftsDiv.appendChild(div);
      });
    }

    // 初始化
    $('#daily-date').textContent = `${todayStr} 星期${['日','一','二','三','四','五','六'][new Date().getDay()]}`;
    (function initDaily() {
      let cached = null;
      try {
        cached = JSON.parse(localStorage.getItem('dailyTopicsCache') || 'null');
      } catch { localStorage.removeItem('dailyTopicsCache'); }
      if (cached && cached.date === todayStr && cached.topics?.length) {
        renderTopics(cached.topics);
        if (localStorage.getItem('regenDate') !== todayStr) setRegenRemaining(3);
      } else {
        $('#daily-topics-area').innerHTML = '<button id="gen-daily-btn" style="width:100%">生成今日话题</button>';
        document.getElementById('gen-daily-btn').addEventListener('click', genDailyTopics);
      }
    })();
    loadSmallTopic();
  </script>
</body>
</html>
